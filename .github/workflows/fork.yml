name: fork

# This branch (`fork`) holds only fork config: this caller, the carried topic
# branches (.fork/branches) and recorded conflict resolutions (.fork/rr-cache).
# `main` mirrors upstream and only ever fast-forwards; every topic branch is
# cut from it, so each one is also a clean upstream pull request. Manage it with `fork`.
on:
  push:
    branches: [fork]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the latest release already ships this merge
        type: boolean
        default: false

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: zysys/github-workflows/.github/workflows/fork.yml@d20befec3210bbca387dd98f43f71cce48b75f16 # d20befec3210bbca387dd98f43f71cce48b75f16
    permissions:
      contents: write
    with:
      scripts_ref: d20befec3210bbca387dd98f43f71cce48b75f16
      mirror: main
      binary: foxguard
      check: 'cargo test --locked --lib'
      build: 'cargo build --release --locked --bin foxguard'
      artifact: target/release/foxguard
      smoke: '"$BIN" --version | grep -q foxguard'
      targets: >-
        [{"target":"darwin-arm64","os":"macos-latest"},
         {"target":"linux-x64","os":"ubuntu-22.04"}]
      force: ${{ inputs.force || false }}
