name: Fork Release

# Fork-only release: builds the macOS arm64 binary from the tagged commit and
# attaches it with a checksum file. Triggered by tags such as v0.14.1-fork.1.
# Upstream's Release workflow (workflow.yml) ignores these tags because it
# needs publishing secrets this fork does not have.

on:
  push:
    tags:
      - "v*-fork.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and release macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88.0"
          targets: aarch64-apple-darwin

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-aarch64-apple-darwin-cargo-fork-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-aarch64-apple-darwin-cargo-fork-release-

      - name: Build
        run: cargo build --locked --release --bin foxguard --target aarch64-apple-darwin

      - name: Package and checksum
        run: |
          mkdir release
          cp target/aarch64-apple-darwin/release/foxguard release/foxguard-macos-aarch64
          cd release
          shasum -a 256 foxguard-macos-aarch64 > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
