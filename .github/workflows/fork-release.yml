name: Fork Release

# Fork-only release: builds the macOS arm64 binary from the tagged commit and
# attaches it with a checksum file. Triggered by tags such as v0.14.1-fork.1.
# Upstream's Release workflow (workflow.yml) also matches `v*` tags but needs
# publishing secrets this fork does not have, so it is disabled in the fork's
# Actions settings.

on:
  push:
    tags:
      - "v*-fork.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and release macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        run: rustup toolchain install 1.88.0 --profile minimal --target aarch64-apple-darwin --no-self-update && rustup default 1.88.0

      - name: Build
        run: cargo build --locked --release --bin foxguard --target aarch64-apple-darwin

      - name: Package and checksum
        run: |
          mkdir release
          cp target/aarch64-apple-darwin/release/foxguard release/foxguard-macos-aarch64
          cd release
          shasum -a 256 foxguard-macos-aarch64 > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" release/* --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
